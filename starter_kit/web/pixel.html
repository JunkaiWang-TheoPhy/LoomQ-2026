<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Quantum Atlas 像素调查局：在一张小小的像素地图里寻找三枚量子调查碎片。">
  <title>Quantum Atlas · 像素调查局</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/pixel.css">
</head>
<body>
  <main class="pixel-shell">
    <canvas id="pixel-canvas" width="384" height="256" tabindex="0" aria-label="像素风二维调查地图"></canvas>
    <header class="pixel-hud" aria-label="像素案件状态">
      <a class="pixel-logo" href="/">QA <span>像素调查局</span></a>
      <div class="pixel-objective"><small>MISSION 01</small><strong id="pixel-objective">找齐三枚调查碎片</strong></div>
      <div class="pixel-counter"><span id="pixel-shards">0 / 3</span><small>碎片</small></div>
      <button id="pixel-reset" type="button" aria-label="重置像素案件">↻</button>
    </header>
    <aside class="pixel-controls"><kbd>方向键 / WASD</kbd> 移动 <kbd>E</kbd> 调查</aside>
    <div id="pixel-toast" class="pixel-toast" aria-hidden="true"></div>
    <section id="pixel-dialogue" class="pixel-dialogue" role="dialog" aria-modal="true" aria-labelledby="pixel-speaker" hidden>
      <div class="pixel-avatar" aria-hidden="true">●</div>
      <div><small id="pixel-kicker">调查记录</small><h1 id="pixel-speaker">???</h1><p id="pixel-text"></p><div id="pixel-choices" class="pixel-choices"></div></div>
      <button id="pixel-close" type="button">继续 <kbd>空格</kbd></button>
    </section>
    <section id="pixel-start" class="pixel-start">
      <div class="pixel-sun" aria-hidden="true"></div>
      <small>QUANTUM ATLAS · SIDE QUEST</small>
      <h1>像素调查局</h1>
      <p>把三枚散落的调查碎片交给小满，<br>让量子井重新亮起来。</p>
      <button id="pixel-start-button" type="button">开始调查 <span>ENTER</span></button>
      <em>方向键 / WASD 移动 · E 调查</em>
    </section>
    <section id="pixel-complete" class="pixel-complete" role="dialog" aria-modal="true" hidden>
      <small>QUEST CLEAR</small><h2>量子井亮了！</h2><p id="pixel-complete-text"></p><button id="pixel-continue" type="button">继续在地图里走走</button><a href="/">回到 LoomQ 实验室</a>
    </section>
    <button id="pixel-touch-action" class="pixel-touch-action" type="button" aria-label="调查附近目标">E</button>
    <div id="pixel-stick" class="pixel-stick" aria-label="像素版触屏移动摇杆"><i></i></div>
    <p id="pixel-sr" class="pixel-sr" aria-live="polite"></p>
  </main>
  <script src="/pixel-adventure-engine.js" defer></script>
  <script src="/pixel.js" defer></script>
</body>
</html>
